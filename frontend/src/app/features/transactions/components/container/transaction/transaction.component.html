<div class="transaction-container">
  <app-feature-header
    [title]="'transactions.header.title' | translate"
    [btnLabel]="'transactions.header.addTransaction' | translate"
    (create)="openTransactionModal()"
  />
  <app-transaction-table
    [transactions]="allTransactions()"
    [accounts]="allAccounts()"
    [settings]="applicationStore.settings()"
  />
</div>

<app-transaction-modal #transactionModal (transactionCreated)="createTransaction($event)" />
