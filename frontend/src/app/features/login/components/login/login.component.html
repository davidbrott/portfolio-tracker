<main class="login">
  <section class="login__container">
    <h1>{{ 'common.title' | translate }}</h1>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label for="username" class="form-label">{{ 'login.username' | translate }}</label>
        <input id="username" class="form-control" type="text" [formField]="loginForm.username" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">{{ 'login.password' | translate }}</label>
        <input
          id="password"
          class="form-control"
          type="password"
          [formField]="loginForm.password"
        />
      </div>
      <button type="submit" class="btn btn-primary w-100">
        {{ 'common.button.login' | translate }}
      </button>
    </form>
  </section>
</main>
