<div #modal class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Konto erstellen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="account-name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="account-name"
            [formField]="accountForm.name"
          />
        </div>
        <div class="mb-3">
          <label for="account-bank-name" class="form-label">Bank</label>
          <input
            type="text"
            class="form-control"
            id="account-bank-name"
            [formField]="accountForm.bankName"
          />
        </div>
        <div class="mb-3">
          <label for="account-initial-blanace" class="form-label">Kontostand</label>
          <input
            type="number"
            class="form-control"
            id="account-initial-balance"
            [formField]="accountForm.initialBalance"
          />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
        <button type="button" class="btn btn-primary" (click)="createAccount()">Speichern</button>
      </div>
    </div>
  </div>
</div>
