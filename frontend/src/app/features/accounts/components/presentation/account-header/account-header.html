<div class="account-header-container">
  <h3>{{ 'accounts.header.title' | translate }}</h3>
  <button type="button" class="btn btn-secondary btn-sm" (click)="openAccountModal()">
    <span class="fa-solid fa-plus"></span>
    {{ 'accounts.header.addAccount' | translate }}
  </button>
</div>

<app-account-modal #modal (accountCreated)="accountCreated.emit($event)" />
